<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Umundurowanie zuchowe</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        .container img {
            width: 50%;
            height: 100%;
            object-fit: cover; /* wypełnia cały obszar bez zniekształceń */
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="pierscien.jpg" alt="Pierścień 1">
        <img src="pierscien2.jpg" alt="Pierścień 2">
    </div>
</body>
</html>
